[Entity Map]
;
; MSTN  to Gtype 3d entity map
;
IGDS_LINE = GLine : 0
IGDS_LINESTRING = GLineString : 0
IGDS_BSPCURHDR = GBspCurve : 0
IGDS_SHAPE = GPlane : 0
IGDS_ELLIPSE = GEllipse : 0
IGDS_ARC = GArc : 0
IGDS_CURVE = GBspCurve : 0
IGDS_CPLXSTR=GComplexString:0
IGDS_CPLXSHAPE=GPlane:0
IGDS_BSPSURHDR = GBspSurface : 0
IGDS_CONE = 0 : GC_IGDS_CONEToGTypeForAssembly
IGDS_SURF = 0 : GC_IGDS_SURFToGTypeForAssembly
IGDS_SOLID = 0 : GC_IGDS_SURFToGTypeForAssembly
;IGDS_TEXT = GTextBox : 0
;IGDS_TEXT_NODE = GTextBox : 0
IGDS_CELL=GSymbolInstance : 0
IGDS_SHARCELLINST=GSymbolInstance:0
IGDS_MULTILINE=GGroup:0
IGDS_MICROSTATIONELM=0:GC_IGDS_ProcessType66
IGDS_TYPE5=0:GC_IGDS_ProcessType5
IGDS_ATTRIBUTE=GTextBox:0

;
; Gtype 3d to MSTN entity map
;
GPoint = IGDS_LINE : 0
GLine = IGDS_LINE : 0
GLineString = IGDS_LINESTRING : 0
GComplexString=IGDS_CPLXSTR:0
GEllipse = IGDS_ELLIPSE : 0
GArc = IGDS_ELLIPSE : 0
GBspCurve = IGDS_BSPCURHDR : 0
GBspSurface = IGDS_BSPSURHDR : 0
GCone = 0 : GC_GConeToIGDSElements
;GText = 0 : GC_GTextBoxToIGDStext
GSymbolDefinition= IGDS_SHARCELLDEF : 0
GSymbolInstance= IGDS_SHARCELLINST : 0

