<html>
<head>
<meta http-equiv="Content-Type" content="text/html">
<title>Visual Frame</title>

<meta content="Generated with IPA WebPublishing from Immersive Design, Inc. http://www.immdesign.com" name="description">

<STYLE type='text/css'>@import url("styles.css");</STYLE>
<script LANGUAGE="JavaScript" src="util.js"></script>

<script language="javascript">
<!-- Begin

top_level.vis = window

var n_dots = -1
function webview_loaded() {
	if ( top_level && typeof(top_level.IPAControl) != 'undefined' && typeof(top_level.IPAControl.Fixed) != 'undefined' ) {
		dots.innerHTML = ''
		webview_complete.innerHTML = ''
	} else {
		n_dots++
		if ( n_dots == 0 ) dots.innerHTML = '.'
		if ( n_dots == 1 ) dots.innerHTML = '..'
		if ( n_dots == 2 ) dots.innerHTML = '...'
		if ( n_dots == 3 ) dots.innerHTML = '....'
		if ( n_dots == 4 ) { dots.innerHTML = '.....'; n_dots = -1 }
		setTimeout( "webview_loaded()", 1000 )
	}
}

function codebase ()
{
	var cab = top_level.gtv("codebase")
	if (cab == "") {
		cab = "http://www.immdesign.com/webview/IPAWebView.cab"
	} else {
		cab = "file:///" + dirlevel() + cab
	}
	cab = "CODEBASE=\"" + cab + "#Version=1,0,0,58\""
	return cab
}

function dirlevel ()
{
	var d = top_level.document.URL.replace (/\\/g, "/")
	var i = d.lastIndexOf("/")
	d = d.slice(0,i)+"/"
	if ( d.search(/file:/i) == 0 ) {
		d = d.slice(7)
	}
	return unescape(d)
}

function WebViewCheck()
{
	var ua = window.navigator.userAgent
	if (ua.indexOf('MSIE') < 0 || ua.indexOf('MSIE 2') >= 0 || ua.indexOf('MSIE 3') >= 0) {
		alert( "You must use Internet Explorer 4.0 or higher to run IPA WebView." )
	} else {

		// get starting directory & idasf file location
		var dir_level = dirlevel ()
		var cb = codebase ()

		var w = document.body.clientWidth*.95
		var h = document.body.clientHeight-80
		webview.innerHTML = '<OBJECT ID=IPAControl CLASSID=CLSID:22CF0C35-80CE-11D3-9354-00105AA793BF ' + cb + ' width='+w+' height='+h+' ><PARAM Name=Openfile Value=\"'+dir_level+top_level.get_assembly_name()+'\"><PARAM Name=Autoplay Value=0><PARAM Name=Fixed Value=1></OBJECT>'
		top_level.IPAControl = IPAControl
		webview_loaded()
		top_level.IPAControl.MouseMode = 1
	}
}

function resize_me()
{
	top_level.IPAControl.width = document.body.clientWidth*.95
	top_level.IPAControl.height = document.body.clientHeight-80
}

//-->
</script>

</head>
<body class="vis" onload="WebViewCheck()" onResize="resize_me()" >
<span id='webview_complete' align=left><br><br>&nbsp;&nbsp;<b>Loading IPA WebView <span id="dots"></span><br><br></b></span>
