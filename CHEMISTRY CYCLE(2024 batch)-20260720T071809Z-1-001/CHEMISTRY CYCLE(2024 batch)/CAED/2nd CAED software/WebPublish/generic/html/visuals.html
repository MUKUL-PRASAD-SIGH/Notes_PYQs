<script language="javascript">
<!-- Begin

top_level.vis = window

var n_dots = -1
function webview_loaded() {
	if ( top_level && typeof(top_level.IPAControl) != 'undefined' && typeof(top_level.IPAControl.Fixed) != 'undefined' ) {
		dots.innerHTML = ''
		webview_complete.innerHTML = ''
	} else {
		n_dots++
		if ( n_dots == 0 ) dots.innerHTML = '.'
		if ( n_dots == 1 ) dots.innerHTML = '..'
		if ( n_dots == 2 ) dots.innerHTML = '...'
		if ( n_dots == 3 ) dots.innerHTML = '....'
		if ( n_dots == 4 ) { dots.innerHTML = '.....'; n_dots = -1 }
		setTimeout( "webview_loaded()", 1000 )
	}
}

function codebase ()
{
	var cab = top_level.gtv("codebase")
	if (cab == "") {
		cab = "http://www.immdesign.com/webview/IPAWebView.cab"
	} else {
		cab = "file:///" + dirlevel() + cab
	}
	cab = "CODEBASE=\"" + cab + "#Version=1,0,0,79\""
	return cab
}

function dirlevel ()
{
	var d = top_level.document.URL.replace (/\\/g, "/")
	var i = d.lastIndexOf("/")
	d = d.slice(0,i)+"/"
	if ( d.search(/file:/i) == 0 ) {
		d = d.slice(7)
	}
	return unescape(d)
}

function WebViewCheck()
{
	var ua = window.navigator.userAgent
	if (ua.indexOf('MSIE') < 0 || ua.indexOf('MSIE 2') >= 0 || ua.indexOf('MSIE 3') >= 0) {
		alert( "You must use Internet Explorer 4.0 or higher to run IPA WebView." )
	} else {

		// get starting directory & idasf file location
		var dir_level = dirlevel ()
		var cb = codebase ()

		var w = document.body.clientWidth*.95
		var h = document.body.clientHeight-80
		webview.innerHTML = '<OBJECT ID=IPAControl CLASSID=CLSID:22CF0C35-80CE-11D3-9354-00105AA793BF ' + cb + ' width='+w+' height='+h+' ><PARAM Name=Openfile Value=\"'+dir_level+top_level.get_assembly_name()+'\"><PARAM Name=Autoplay Value=0><PARAM Name=Fixed Value=1></OBJECT>'
		top_level.IPAControl = IPAControl
		webview_loaded()
	}
}

function resize_me()
{
	top_level.IPAControl.width = document.body.clientWidth*.95
	top_level.IPAControl.height = document.body.clientHeight-80
}

function findform() {
	findit( searchID.value )
	searchID.value = ""
}

//-->
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="select(id)">
if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" ) {
	top_level.objectList[id].sel=1
	var obj = top_level.instr["n"+id]
	if (obj) {
		obj.style.fontWeight = "bold"
	}
	var BOMid = top_level.idToBOMid[id]
	obj = top_level.instr["b"+BOMid]
	if (obj) {
		obj.style.fontWeight = "bold"
		if (!top_level.busy) {
			top_level.busy = 1
			var i
			var a = top_level.objectList[BOMid].BOMids
			for (i = 0; i < a.length; ++i) {
				top_level.IPAControl.Select (a[i])
			}
			top_level.busy = 0
		}
	}
	if ( top_level.props ) {
		top_level.redrawProps (id)
	}
	if ( showonly_state == 1 ) {
		top_level.IPAControl.ShowOnly()
	}
	else {
		top_level.IPAControl.Show()
	}
}
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="deselect(id)">
if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" ) {
	top_level.objectList[id].sel=0
	var obj = top_level.instr["n"+id]
	if (obj) {
		obj.style.fontWeight = "normal"
	}
	obj = top_level.instr["b"+top_level.idToBOMid[id]]
	if (obj) {
		obj.style.fontWeight = "normal"
	}
	if ( top_level.props ) {
		top_level.redrawProps (-1)
	}
}
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="show(id)">
if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" ) {
	top_level.objectList[id].hid=0
	var obj = top_level.instr["i"+id]
	if (obj) {
		if (obj.src.indexOf ("_hide") >= 0) obj.src = obj.src.replace (/_hide/i,"")
	}
}
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="hide(id)">
if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" ) {
	top_level.objectList[id].hid=1
	var obj = top_level.instr["i"+id]
	if (obj) {
		if (obj.src.indexOf ("_hide") < 0) obj.src = obj.src.replace (/\.gif/, "_hide.gif")
	}
}
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="loadfailed(code)">
	if (typeof (issued_message) == "undefined") {
		issued_message = 1
	}
	window.top.location = "failed_pwd.html"
</script>
