<html>
<head>
<script LANGUAGE="JavaScript" src="../html/util.js"></script>
<script LANGUAGE="JavaScript">
function write_frames() {
var aType=top_level.gtv("aType")
var onef=aType=="part"||aType=="sheetmetal"
document.writeln ('<FRAMESET frameborder="0" border="0" rows="50,*,18" onbeforeunload="top_level.redrawTOC();top_level.redrawProps(-1)">')
document.writeln ('  <FRAME scrolling="auto" name="header_frame" src="header.html">')
document.writeln ('  <FRAMESET frameborder="0" border="0" cols="265,*" >')
if (!onef) {
document.writeln ('    <FRAMESET frameborder="1" border="0" rows="75%,*" >')
document.writeln ('      <FRAME scrolling="auto" name="instruction_frame" src="inst.html" >')
}
document.writeln ('      <FRAME scrolling="auto" name="properties_frame" src="prop.html" >')
if (!onef) {
document.writeln ('    </FRAMESET>')
}
if (!onef) {
document.writeln ('    <FRAME scrolling="auto" name="visuals_frame" src="visuals.html">')
} else {
document.writeln ('    <FRAME scrolling="auto" name="visuals_frame" src="part_visuals.html">')
}
document.writeln ('  </FRAMESET>')
document.writeln ('  <FRAME scrolling="auto" name="footer_frame" src="footer.html">')
document.writeln ('</FRAMESET>')
}
</script>
</head>
<script LANGUAGE="JavaScript">
write_frames()
</script>
</html>
