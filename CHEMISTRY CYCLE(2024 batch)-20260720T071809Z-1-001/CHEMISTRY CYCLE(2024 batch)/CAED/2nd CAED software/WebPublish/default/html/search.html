<HTML>
<head>

<script LANGUAGE="JavaScript" src="util.js"></script>
<SCRIPT language="javascript">top_level.instr = window;</script>
<SCRIPT language="javascript">

function findform( selectLabel, searchValue ) {
	if ( searchValue != "" ) SelectObjectByProperty( selectLabel, searchValue )
	searchID.value = ""
}

// Color Functions

function GetColors( ) {
if ( CheckWebView() ) {
	top_level.busy = 1
	getColors2( top_level.objectTree  )
	top_level.busy = 0
}
}
function getColors2( treeNode ) {
	var i = 0;
	if (treeNode.nodeArray.length > 0 ) {
		for (i=0; i<treeNode.nodeArray.length;i++) {
			var id = treeNode.nodeArray[i].nodeId
			if (typeof (top_level.objectList[id].color) == "undefined") {
				top_level.IPAControl.Select( id )
				top_level.objectList[id].color = top_level.IPAControl.getColor()
				top_level.IPAControl.DeselectAll();
			}
			if (treeNode.nodeArray[i].nodeLeaf) {
			} else {
				getColors2(treeNode.nodeArray[i] )
			}
		}
	}
}

function ResetColors( ) {
if ( CheckWebView() ) {
	DeselectAll();
	top_level.busy = 1
	resetColors2( top_level.objectTree  )
	top_level.busy = 0
}
}
function resetColors2( treeNode ) {
	var i = 0;
	if (treeNode.nodeArray.length > 0 ) {
		for (i=0; i<treeNode.nodeArray.length;i++) {
			var id = treeNode.nodeArray[i].nodeId
			top_level.IPAControl.Select( id )
			top_level.IPAControl.setColor( top_level.objectList[id].color )
			top_level.IPAControl.DeselectAll();
			if (treeNode.nodeArray[i].nodeLeaf) {
			} else {
				resetColors2(treeNode.nodeArray[i] )
			}
		}
	}
}

// actually get the colors here
GetColors ()

</script>
</head>
