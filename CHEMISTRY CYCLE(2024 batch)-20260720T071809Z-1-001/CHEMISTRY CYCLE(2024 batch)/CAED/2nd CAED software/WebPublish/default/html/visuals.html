<!-- Begin

top_level.vis = window

var n_dots = -1
function webview_loaded() {
	if ( top_level && typeof(top_level.IPAControl) != 'undefined' && typeof(top_level.IPAControl.Fixed) != 'undefined' ) {
		dots.innerHTML = ''
		webview_complete.innerHTML = ''

		// automatically set the IPA WebView background color to the frame color
		// comment these lines out if you want to use the colors set in IPA
		top_level.IPAControl.Gradient = 0
		SetBGColor( document.bgColor );
		SetTextColor( "#000000" )
		top_level.IPAControl.Shadow = 0
		top_level.IPAControl.AutoHide = 0

	} else {
		n_dots++
		if ( n_dots == 0 ) dots.innerHTML = '.'
		if ( n_dots == 1 ) dots.innerHTML = '..'
		if ( n_dots == 2 ) dots.innerHTML = '...'
		if ( n_dots == 3 ) dots.innerHTML = '....'
		if ( n_dots == 4 ) { dots.innerHTML = '.....'; n_dots = -1 }
		setTimeout( "webview_loaded()", 1000 )
	}
}

function codebase ()
{
	var cab = top_level.gtv("codebase")
	if (cab == "") {
		cab = "http://www.immdesign.com/webview/IPAWebView.cab"
	} else {
		cab = "file:///" + dirlevel() + cab
	}
	// set minimum cab Version here
	// if you always want to check for the latest version, use Version=-1,-1,-1,-1
	cab = "CODEBASE=\"" + cab + "#Version=1,0,0,86\""
	return cab
}

function dirlevel ()
{
	var d = top_level.document.URL.replace (/\\/g, "/")
	var i = d.lastIndexOf("/")
	d = d.slice(0,i)+"/"
	if ( d.search(/file:/i) == 0 ) {
		d = d.slice(7)
	}
	return unescape(d)
}

function WebViewCheck()
{
	var ua = window.navigator.userAgent
	if (ua.indexOf('MSIE') < 0 || ua.indexOf('MSIE 2') >= 0 || ua.indexOf('MSIE 3') >= 0) {
		alert( "You must use Internet Explorer 4.0 or higher to run IPA WebView." )
	} else {

		// get starting directory & idasf file location
		var dir_level = dirlevel ()
		var cb = codebase ()

		var w = document.body.clientWidth-135
		var h = document.body.clientHeight-30
		webview.innerHTML = '<OBJECT ID=IPAControl CLASSID=CLSID:22CF0C35-80CE-11D3-9354-00105AA793BF ' + cb + ' width='+w+' height='+h+' ><PARAM Name=Openfile Value=\"'+dir_level+top_level.get_assembly_name()+'\"><PARAM Name=Autoplay Value=0><PARAM Name=Fixed Value=1></OBJECT>'
		top_level.IPAControl = IPAControl
		webview_loaded()	
	}
	top_level.initialize_states()
	hideTable()
	showTable()
}

function resize_me()
{
	if (document.body.clientWidth > 135)
	{
		top_level.IPAControl.width = document.body.clientWidth-135
	}
	else
	{
		top_level.IPAControl.width = 1
	}
	if (document.body.clientHeight > 30)
	{
		//resize using scrollHeight instead of clientHeight on resize
		top_level.IPAControl.height = document.body.scrollHeight-30
	}
	else
	{
		top_level.IPAControl.height = 1
	}
}

function findform() {
	findit( searchID.value )
	searchID.value = ""
}

function window.onbeforeprint() {
this.focus();
hideTable();
top_level.IPAControl.SetPrintDoc(1);
// this forces a repaint a keeps the scrollbars from showing up in the printout
top_level.IPAControl.height = document.body.clientHeight-70
}

function window.onafterprint() {
top_level.IPAControl.SetPrintDoc(0);
showTable();
resize_me()
}

function print_page() { 
this.focus();
window.print();
}

//-->

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="select(id)">

function selSimilar (BOMid) {
	var a = top_level.objectList[BOMid].BOMids
	for (var i = 0; i < a.length; ++i) {
		top_level.IPAControl.Select (a[i])
	}
}

if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" 
) {


	top_level.objectList[id].sel=1

	var obj = top_level.instr["n"+id]
	if (obj) {
		obj.style.fontWeight = "bold"
	}

	if (!top_level.busy) {
		top_level.busy = 1
		var BOMid = top_level.idToBOMid[id]

		obj = top_level.instr["b"+BOMid]
		if (obj) {
			selSimilar (BOMid)
			top_level.redrawBOM();
		}

		obj = top_level.instr["c"+BOMid]
		if (obj) {
			selSimilar (BOMid)
			top_level.redrawCAT();
		}

		top_level.busy = 0
		bullseye (id)
	}

	if ( top_level.props ) {
		top_level.redrawProps (id);
	}

	if ( showonly_state == 1 ) {
		top_level.IPAControl.ShowOnly();
	} else {
		top_level.IPAControl.Show();
	}
}

var aType=top_level.gtv("aType")
var onef=aType=="part"||aType=="sheetmetal"
if ( onef ) { 
top_level.redrawProps (id);
}
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="deselect(id)">

if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" 
	) {

	top_level.objectList[id].sel=0

	var obj = top_level.instr["n"+id]
	if (obj) {
		obj.style.fontWeight = "normal"
	}

	var BOMid = top_level.idToBOMid[id]
	obj = top_level.instr["b"+BOMid]
	if (top_level.GetSelectedObject() == -1 && obj) {
		top_level.redrawBOM();
	}
	obj = top_level.instr["c"+BOMid]
	if (obj) {
		top_level.redrawCAT();
	}

	if ( top_level.props ) {
		top_level.redrawProps (-1);
	}

var page = /section/i
if ( page.test(top_level.instr.document.location) ) { MoveCrossSection() }
}

var aType=top_level.gtv("aType")
var onef=aType=="part"||aType=="sheetmetal"
if ( onef ) { 
top_level.redrawProps (-1);
}

</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="show(id)">
if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" ) {
	top_level.objectList[id].hid=0
	var obj = top_level.instr["i"+id]
	if (obj) {
		if (obj.src.indexOf ("_hide") >= 0) obj.src = obj.src.replace (/_hide/i,"")
	}
}
</script>

<script LANGUAGE="javascript" FOR="IPAControl" EVENT="hide(id)">
if ( typeof( top_level.objectList ) != "undefined" && 
	typeof( top_level.objectList[id] ) != "undefined" &&
	typeof( top_level.instr ) != "undefined" ) {
	top_level.objectList[id].hid=1
	var obj = top_level.instr["i"+id]
	if (obj) {
		if (obj.src.indexOf ("_hide") < 0) obj.src = obj.src.replace (/\.gif/, "_hide.gif")
	}
}
</script>

function set_vis_side() {
var i = 0;
var done = 0;
while ( !done && typeof(parent.frames[i]) != "undefined" ) {
	// if visuals_frame is found before instruction_frame then put the toolbar on the left
	var aType=top_level.gtv("aType")
	var onef=aType=="part"||aType=="sheetmetal"
	if ( parent.frames[i].name == "visuals_frame" && !onef) done = 1
	if ( parent.frames[i].name == "instruction_frame" ) done = 2
	i++
}
if ( done == 1 ) {
document.writeln("<td valign=\"top\" id=\"toolbarTable\"><td id='webview' valign='top'>&nbsp;</td>")
